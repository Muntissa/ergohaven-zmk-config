---
# Trimmed to the K:03 only (the keyboard actually in use).
# Flash k03_qube to the Qube dongle; k03_left/right are the halves.
include:
  - board: ergohaven
    shield: k03_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: ergohaven
    shield: k03_right
  - board: ergohaven
    shield: k03_qube qube dongle_screen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: k03_qube-ergohaven-zmk
  - board: ergohaven
    shield: settings_reset
